[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-unlearning"
version = "0.1.0"
description = "Machine unlearning methods on LLMs with Factify-5W dataset"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "peft>=0.4.0",
    "trl>=0.7.0",
    "bitsandbytes>=0.41.0",
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]

[tool.setuptools]
packages = []

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.uv]
